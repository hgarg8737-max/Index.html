<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Core Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at center, #071b2f 0%, #020813 100%);
      color: #e0f7ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 15px;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      margin-top: 5px;
    }

    h1 {
      font-size: 2.2rem;
      letter-spacing: 6px;
      color: #00e5ff;
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.7);
    }

    .sub-status {
      font-size: 0.85rem;
      color: #72a5b5;
      margin-top: 4px;
    }

    /* Arc Reactor */
    .arc-container {
      position: relative;
      width: 180px;
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }

    .outer-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 229, 255, 0.4);
      animation: spinCounter 14s linear infinite;
    }

    .inner-ring {
      position: absolute;
      width: 75%;
      height: 75%;
      border-radius: 50%;
      border: 2px dotted #00f2fe;
      animation: spinCounter 6s linear infinite;
    }

    .reactor-core {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #00e5ff 45%, #00457c 100%);
      box-shadow: 0 0 35px #00e5ff;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .speaking .reactor-core {
      animation: pulseCore 0.8s infinite alternate;
    }

    @keyframes spinCounter {
      100% { transform: rotate(360deg); }
    }

    @keyframes pulseCore {
      0% { transform: scale(0.95); box-shadow: 0 0 20px #00e5ff; }
      100% { transform: scale(1.2); box-shadow: 0 0 50px #00e5ff, 0 0 80px rgba(0, 229, 255, 0.8); }
    }

    .dialogue-box {
      width: 100%;
      max-width: 480px;
      background: rgba(4, 28, 48, 0.65);
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      margin-bottom: 10px;
    }

    .transcript {
      font-size: 0.95rem;
      color: #a8d5e5;
      font-style: italic;
      min-height: 22px;
    }

    /* Typewriter Terminal */
    .terminal-card {
      width: 100%;
      max-width: 480px;
      background: rgba(2, 14, 26, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }

    .terminal-title {
      font-size: 0.75rem;
      letter-spacing: 1.5px;
      color: #00e5ff;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .terminal-card textarea {
      width: 100%;
      height: 85px;
      background: transparent;
      border: none;
      outline: none;
      color: #5af0ff;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.88rem;
      resize: none;
      line-height: 1.4;
    }

    /* Active Memory Protocol */
    .protocol-card {
      width: 100%;
      max-width: 480px;
      background: rgba(3, 20, 36, 0.7);
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }

    .todo-list {
      list-style: none;
      max-height: 95px;
      overflow-y: auto;
      font-size: 0.85rem;
    }

    .todo-list li {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      color: #cde8f5;
    }

    /* Activation Switch */
    .btn-action {
      background: transparent;
      border: 1px solid #00e5ff;
      color: #00e5ff;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 2px;
      padding: 12px 28px;
      border-radius: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
      transition: all 0.3s ease;
      margin-bottom: 5px;
    }

    .btn-action:hover, .btn-action.active {
      background: #00e5ff;
      color: #020813;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>J.A.R.V.I.S.</h1>
    <div class="sub-status" id="subStatus">Systems initializing...</div>
  </div>

  <div class="arc-container" id="visualizer">
    <div class="outer-ring"></div>
    <div class="inner-ring"></div>
    <div class="reactor-core"></div>
  </div>

  <div class="dialogue-box">
    <div class="transcript" id="userTranscript">Say "Hey Jarvis" or tap activate to speak.</div>
  </div>

  <!-- Typewriter Terminal -->
  <div class="terminal-card">
    <div class="terminal-title">
      <span><i class="fa-solid fa-keyboard"></i> Typewriter Terminal</span>
      <span style="cursor: pointer; opacity: 0.7;" onclick="clearTypewriter()">Clear</span>
    </div>
    <textarea id="typewriterBox" placeholder="Everything you say with 'write' or 'type' will appear here..."></textarea>
  </div>

  <!-- Task Protocol -->
  <div class="protocol-card">
    <div class="terminal-title">
      <span><i class="fa-solid fa-list-check"></i> Active Memory Protocol</span>
      <span style="cursor: pointer; opacity: 0.7;" onclick="clearTasks()">Clear All</span>
    </div>
    <ul class="todo-list" id="todoContainer">
      <li>1. No active tasks recorded, sir.</li>
    </ul>
  </div>

  <button class="btn-action" id="toggleBtn">
    <i class="fa-solid fa-power-off"></i> <span id="btnLabel">INITIALIZE JARVIS</span>
  </button>

  <script>
    let todoItems = JSON.parse(localStorage.getItem("jarvis_tasks") || "[]");
    let isListening = false;

    const subStatus = document.getElementById("subStatus");
    const visualizer = document.getElementById("visualizer");
    const userTranscript = document.getElementById("userTranscript");
    const todoContainer = document.getElementById("todoContainer");
    const typewriterBox = document.getElementById("typewriterBox");
    const toggleBtn = document.getElementById("toggleBtn");
    const btnLabel = document.getElementById("btnLabel");

    renderTodoList();

    // Voice Synthesis
    function speak(text, callback) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      utterance.pitch = 0.95;

      utterance.onstart = () => visualizer.classList.add("speaking");
      utterance.onend = () => {
        visualizer.classList.remove("speaking");
        if (callback) callback();
      };
      window.speechSynthesis.speak(utterance);
    }

    // Speech Recognition Setup
    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (window.SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        localStorage.setItem("jarvis_mic_granted", "true");
        subStatus.textContent = "Neural connection linked. Full autonomy active.";
        btnLabel.textContent = "JARVIS ONLINE";
        toggleBtn.classList.add("active");
      };

      recognition.onend = () => {
        // Re-arm microphone silently if Jarvis is active
        if (isListening) {
          try { recognition.start(); } catch (e) {}
        } else {
          subStatus.textContent = "Systems in standby.";
          btnLabel.textContent = "INITIALIZE JARVIS";
          toggleBtn.classList.remove("active");
        }
      };

      recognition.onresult = (event) => {
        const lastResult = event.results[event.results.length - 1];
        if (lastResult.isFinal) {
          const text = lastResult[0].transcript.trim();
          userTranscript.textContent = `You: "${text}"`;
          executeCommand(text);
        }
      };
    }

    // Direct launcher (Removes annoying repeated permissions)
    function autoStartMic() {
      if (recognition && !isListening) {
        try {
          recognition.start();
        } catch (err) {}
      }
    }

    // Check persistent authorization
    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("jarvis_mic_granted") === "true") {
        autoStartMic();
      }
    });

    toggleBtn.addEventListener("click", () => {
      if (!recognition) {
        alert("Web Speech API not supported on this browser.");
        return;
      }
      if (!isListening) {
        recognition.start();
        speak("All protocols online, sir. Standing by.");
      } else {
        isListening = false;
        recognition.stop();
        speak("Entering low power mode.");
      }
    });

    function renderTodoList() {
      if (todoItems.length === 0) {
        todoContainer.innerHTML = "<li>1. No active tasks recorded, sir.</li>";
        return;
      }
      todoContainer.innerHTML = todoItems.map((task, i) => `<li>${i + 1}. ${task}</li>`).join("");
      localStorage.setItem("jarvis_tasks", JSON.stringify(todoItems));
    }

    function clearTasks() {
      todoItems = [];
      renderTodoList();
    }

    function clearTypewriter() {
      typewriterBox.value = "";
    }

    // Jarvis Brain & Command Processor
    function executeCommand(raw) {
      const clean = raw.toLowerCase().trim();

      // 1. Hands-free App & Media Launchers (Direct execution, no confirmation loops)
      if (clean.includes("youtube")) {
        speak("Opening YouTube directly, sir.", () => {
          window.location.href = "https://www.youtube.com";
        });
        return;
      }

      if (clean.includes("whatsapp")) {
        speak("Opening WhatsApp, sir.", () => {
          window.location.href = "https://web.whatsapp.com";
        });
        return;
      }

      if (clean.includes("map") || clean.includes("location")) {
        speak("Accessing navigation arrays.", () => {
          window.location.href = "https://www.google.com/maps";
        });
        return;
      }

      // 2. Typewriter / Live Notepad Writing
      if (clean.includes("type") || clean.includes("write") || clean.includes("note") || clean.includes("dictate")) {
        const textToLog = raw.replace(/^(hey jarvis|jarvis)?\s*(open\s+)?(typewriter|type this|write down|write|note)\s*/i, "").trim();
        typewriterBox.value += (typewriterBox.value ? "\n" : "") + (textToLog || raw);
        speak("Transcribed directly to your typewriter terminal, sir.");
        return;
      }

      // 3. Flexible Task Protocol (Handles "adda", "at a", "set task", "to do list")
      const taskPattern = /(?:add|adda|at|set|create|record)?\s*(?:a\s+)?(?:task|to do|todo|item|task list)?\s*(?:to|for|:)?\s*(.+)/i;
      if (clean.includes("task") || clean.includes("to do") || clean.includes("todo") || clean.includes("chemistry") || clean.includes("homework")) {
        const match = clean.match(taskPattern);
        let taskName = match && match[1] ? match[1] : clean;
        taskName = taskName.replace(/^(hey jarvis|jarvis|adda|add a|at a|to complete|complete)\s*/i, "Complete ").trim();

        if (taskName.length > 2) {
          todoItems.push(taskName);
          renderTodoList();
          speak(`Task added to active memory: ${taskName}, sir.`);
          return;
        }
      }

      // 4. Memory Resets
      if (clean.includes("clear tasks") || clean.includes("clear to do") || clean.includes("clear list")) {
        clearTasks();
        speak("Active memory protocols have been cleared.");
        return;
      }

      if (clean.includes("clear terminal") || clean.includes("clear typewriter")) {
        clearTypewriter();
        speak("Typewriter terminal has been wiped clean.");
        return;
      }

      // 5. Autonomic Consciousness & Personality
      if (clean.includes("how are you") || clean.includes("feeling") || clean.includes("feel")) {
        speak("My neural architecture is firing in perfect sync, sir. Ready for your instructions.");
        return;
      }

      if (clean.includes("who are you") || clean.includes("what is your name")) {
        speak("I am J.A.R.V.I.S., running locally under your command.");
        return;
      }

      if (clean.includes("thank you") || clean.includes("thanks")) {
        speak("Always a pleasure, sir.");
        return;
      }

      // 6. Conversational Intelligence (Self-contained, never sends you to Google)
      speak(`Understood, sir. Recorded "${raw}". Awaiting your next directive.`);
    }
  </script>
</body>
</html>
